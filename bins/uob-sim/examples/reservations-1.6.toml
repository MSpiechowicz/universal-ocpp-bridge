schema_version = 1
seed = 113

[[steps]]
id = "connect"
station = "alpha"
action = "connect"
timeout_ms = 5000

[[steps]]
id = "boot"
station = "alpha"
action = "boot"
timeout_ms = 5000
fixture_id = "wire.ocpp16.boot.valid"
payload = { chargePointVendor = "UOB", chargePointModel = "Independent Reservation Station" }

[[steps]]
id = "explicit-central-authorization"
station = "alpha"
action = "authorize"
timeout_ms = 5000
fixture_id = "wire.ocpp16.authorization.valid"
payload = { idTag = "token-marker-113" }
expect_response = { idTagInfo = { status = "Accepted" } }

[[steps]]
id = "await-native-reservation"
station = "alpha"
action = "await_reservation"
timeout_ms = 30000
expect_response = { activeReservations = 1 }

[[steps]]
id = "matched-real-start"
station = "alpha"
action = "start_transaction"
timeout_ms = 5000
fixture_id = "wire.ocpp16.transaction-start.valid"
use_current_timestamp = true
payload = { connectorId = 1, idTag = "token-marker-113", meterStart = 113 }

[[steps]]
id = "native-termination"
station = "alpha"
action = "assert_reservation"
timeout_ms = 5000
expect_response = { activeReservations = 0 }

[[steps]]
id = "disconnect"
station = "alpha"
action = "disconnect"
timeout_ms = 5000

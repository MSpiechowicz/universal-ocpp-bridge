schema_version = 1
seed = 123

[[steps]]
id = "connect"
station = "alpha"
action = "connect"
timeout_ms = 5000

# chargingStation.model is CiString20 and vendorName CiString50.
[[steps]]
id = "boot"
station = "alpha"
action = "boot"
timeout_ms = 5000
fixture_id = "sim.ocpp201.boot.accepted"
payload = { reason = "PowerUp", chargingStation = { vendorName = "UOB", model = "FirmwareStation201", firmwareVersion = "sim-1.0.0" } }

# The CSMS sends UpdateFirmware; every FirmwareStatusNotification carries its requestId.
[[steps]]
id = "await-installed-firmware"
station = "alpha"
action = "await_firmware"
timeout_ms = 120000
expect_response = { active = false, lastStatus = "Installed", reboots = 1, pendingStatuses = 0 }

[[steps]]
id = "disconnect"
station = "alpha"
action = "disconnect"
timeout_ms = 5000

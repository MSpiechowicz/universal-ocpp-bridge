payload = { connectorId = 1, transactionId = 42, meterValue = [{ timestamp = "2026-09-01T00:05:02Z", sampledValue = [{ value = "1250", context = "Sample.Periodic", format = "Raw", measurand = "Energy.Active.Import.Register", location = "Outlet", unit = "Wh" }] }] }
expect_response = {}

[[steps]]
id = "disconnect-active"
station = "alpha"
action = "disconnect"
timeout_ms = 1000

[[steps]]
id = "connect"
station = "alpha"
action = "connect"
timeout_ms = 1000
expect_event = "connected"
expect_detail = "ocpp1.6"

[[steps]]
id = "boot"
station = "alpha"
action = "boot"
timeout_ms = 1000
fixture_id = "sim.ocpp16.boot.accepted"
expect_message = "BootNotification"
expect_event = "boot_result"
payload = { chargePointVendor = "UOB", chargePointModel = "Simulator" }
expect_response = { currentTime = "2026-09-01T00:00:00Z", interval = 60, status = "Accepted" }

[[steps]]
id = "authorize"
station = "alpha"
action = "authorize"
timeout_ms = 1000
fixture_id = "sim.ocpp16.authorize.accepted"
expect_message = "Authorize"
expect_event = "authorization_result"
payload = { idTag = "LOCAL-USER-1" }
expect_response = { idTagInfo = { status = "Accepted" } }

[[steps]]
id = "available"
station = "alpha"
action = "status"
timeout_ms = 1000
fixture_id = "sim.ocpp16.status.available"
expect_message = "StatusNotification"
expect_event = "status_result"
payload = { connectorId = 1, errorCode = "NoError", status = "Available", timestamp = "2026-09-01T00:00:01Z" }
expect_response = {}

[[steps]]
id = "start"
station = "alpha"
action = "start_transaction"
timeout_ms = 1000
fixture_id = "sim.ocpp16.transaction.start"
expect_message = "StartTransaction"
expect_event = "transaction_started"
payload = { connectorId = 1, idTag = "LOCAL-USER-1", meterStart = 1000, timestamp = "2026-09-01T00:00:02Z" }
expect_response = { idTagInfo = { status = "Accepted" }, transactionId = 42 }

[[steps]]
id = "meter"
station = "alpha"
action = "meter_values"
timeout_ms = 1000
fixture_id = "sim.ocpp16.transaction.meter"

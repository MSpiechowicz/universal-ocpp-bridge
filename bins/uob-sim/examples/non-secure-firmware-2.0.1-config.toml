schema_version = 1

[[stations]]
id = "alpha"
endpoint = "ws://127.0.0.1:9000/ocpp/alpha"
ocpp_version = "2.0.1"
request_timeout_ms = 5000
reconnect = true

[[stations.evses]]
id = 1
connectors = [1]

[stations.firmware201]
# OCPP 2.0.1 L02 Non-Secure Firmware Update: no manufacturer root, no signature states.
private_state_file = "/tmp/uob-sim-non-secure-firmware-201/firmware.json"
mode = "non_secure"
cancel_policy = "cancel"
reboot_after_install = true

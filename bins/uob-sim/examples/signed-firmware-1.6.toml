schema_version = 1
seed = 122

[[steps]]
id = "connect"
station = "alpha"
action = "connect"
timeout_ms = 5000

[[steps]]
id = "boot"
station = "alpha"
action = "boot"
timeout_ms = 5000
fixture_id = "wire.ocpp16.boot.valid"
payload = { chargePointVendor = "UOB", chargePointModel = "Independent Signed Firmware Station", firmwareVersion = "sim-1.0.0" }

# The CSMS sends SignedUpdateFirmware; every SignedFirmwareStatusNotification carries its requestId.
[[steps]]
id = "await-installed-firmware"
station = "alpha"
action = "await_firmware"
timeout_ms = 120000
expect_response = { active = false, lastStatus = "Installed", reboots = 1, pendingStatuses = 0 }

[[steps]]
id = "disconnect"
station = "alpha"
action = "disconnect"
timeout_ms = 5000

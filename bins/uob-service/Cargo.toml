[package]
name = "uob-service"
description = "Universal OCPP Bridge production service composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "uob"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
uuid.workspace = true
uob-application = { path = "../../crates/application" }
uob-contracts = { path = "../../crates/contracts" }
uob-external-export-adapter = { path = "../../adapters/export" }
uob-ems-scada-http-target-adapter = { path = "../../adapters/target-ems-scada-http" }
uob-management-adapter = { path = "../../adapters/management" }
uob-mqtt-target-adapter = { path = "../../adapters/target-mqtt" }
uob-protocol-adapter = { path = "../../adapters/protocol" }
uob-provider-adapter = { path = "../../adapters/providers" }
uob-storage-adapter = { path = "../../adapters/storage" }
uob-target-adapter = { path = "../../adapters/target" }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true

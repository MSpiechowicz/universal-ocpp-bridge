# Optional administrator-installed drop-in for production preflight.
# Install as uob-release-manager.service.d/preflight.conf after configuring policy.
[Service]
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SETUID CAP_SETGID
InaccessiblePaths=
InaccessiblePaths=-/var/lib/uob-staging -/etc/uob-staging
ReadOnlyPaths=/var/lib/uob /etc/uob

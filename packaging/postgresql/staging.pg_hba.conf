# Install before ALL broader rules (including local trust/peer).
# Separate staging credentials; only local Unix sockets or TLS loopback are admitted.
local   uob_staging  uob_staging                          scram-sha-256
hostssl uob_staging  uob_staging  127.0.0.1/32             scram-sha-256
hostssl uob_staging  uob_staging  ::1/128                  scram-sha-256
# replication is a special database selector, not covered by "all".
local   replication uob_staging                          reject
host    replication uob_staging  all                     reject
local   all         uob_staging                          reject
host    all         uob_staging  all                     reject

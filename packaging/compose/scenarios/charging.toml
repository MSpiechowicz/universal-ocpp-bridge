station = "station-b"
action = "start_transaction"
timeout_ms = 10000
fixture_id = "compose.ocpp201.start"
expect_message = "TransactionEvent"
expect_event = "transaction_started"
use_awaited_remote_start_id = true
payload = { eventType = "Started", timestamp = "__START_TIME__", triggerReason = "RemoteStart", seqNo = 0, transactionInfo = { transactionId = "compose-tx-b", chargingState = "Charging" }, evse = { id = 1, connectorId = 1 } }

[[steps]]
id = "meter-b"
station = "station-b"
action = "meter_values"
timeout_ms = 10000
fixture_id = "compose.ocpp201.meter"
expect_message = "TransactionEvent"
expect_event = "meter_values_result"
payload = { eventType = "Updated", timestamp = "__METER_TIME__", triggerReason = "MeterValuePeriodic", seqNo = 1, transactionInfo = { transactionId = "compose-tx-b", chargingState = "Charging" }, evse = { id = 1, connectorId = 1 }, meterValue = [{ timestamp = "__METER_TIME__", sampledValue = [{ value = 2250.25, context = "Sample.Periodic", measurand = "Energy.Active.Import.Register", phase = "L1", location = "Outlet", unitOfMeasure = { unit = "Wh" } }] }] }

[[steps]]
id = "remote-stop-b"
station = "station-b"
action = "await_remote_stop"
timeout_ms = 90000
expect_event = "remote_stop_received"

[[steps]]
id = "stop-b"
station = "station-b"
action = "stop_transaction"
timeout_ms = 10000
fixture_id = "compose.ocpp201.stop"
expect_message = "TransactionEvent"
expect_event = "transaction_stopped"
payload = { eventType = "Ended", timestamp = "__STOP_TIME__", triggerReason = "RemoteStop", seqNo = 2, transactionInfo = { transactionId = "compose-tx-b", chargingState = "Idle", stoppedReason = "Remote" }, evse = { id = 1, connectorId = 1 } }
expect_response = {}

[[steps]]
id = "disconnect-b"
station = "station-b"
action = "disconnect"
timeout_ms = 10000
expect_event = "disconnected"
expect_detail = "stopped"

[graph]
all-features = true
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0009", reason = "Only RFC 3339 parsing is used; remove after the workspace MSRV reaches 1.88 and time can be upgraded to 0.3.47 or newer" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

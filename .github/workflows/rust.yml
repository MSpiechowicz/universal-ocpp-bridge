name: Rust repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    name: Format, lint, test, and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify staging resource shedding on the disposable runner
        run: ./scripts/test-staging-resources.sh --disposable
      - name: Verify disk exhaustion isolation on the disposable runner
        run: python3 -B scripts/test-disk-isolation.py --disposable
      - name: Restore Cargo dependencies and build outputs
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-1.98-ci-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98-ci-v1-
      - name: Verify the complete Rust workspace
        run: ./scripts/verify-workspace.sh
      - name: Verify service watchdog and bounded restart on the disposable runner
        run: python3 -B scripts/test-service-watchdog.py --disposable
      - name: Verify Linux deployment isolation on the disposable runner
        run: ./scripts/test-environment-isolation.sh

  release:
    name: Version and publish successful main builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: workspace
    environment:
      name: stable-release
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    permissions:
      contents: write # publish source tags and GitHub Releases after approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the successfully verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live repository and environment protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PROTECTION_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_RULESET_ID: ${{ vars.RELEASE_RULESET_ID }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: ./scripts/check-release-protections.sh
      - name: Install the reviewed Cocogitto release
        env:
          COG_ARCHIVE_SHA256: e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb
          COG_ARCHIVE_URL: https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz
        run: |
          archive="$RUNNER_TEMP/cocogitto-7.0.0.tar.gz"
          tool_directory="$RUNNER_TEMP/cocogitto-bin"
          curl --fail --location --proto '=https' --tlsv1.2 "$COG_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$COG_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir --parents "$tool_directory"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install --mode 0755 "$RUNNER_TEMP/x86_64-unknown-linux-musl/cog" "$tool_directory/cog"
          printf '%s\n' "$tool_directory" >>"$GITHUB_PATH"
      - name: Confirm the Cocogitto version
        run: test "$(cog --version)" = "cog 7.0.0"
      - name: Configure the release commit identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create the scoped release identity after approval
        id: release-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Bump main and publish the stable release if needed
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          ./scripts/publish-stable-release.sh

name: Rust repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    name: Format, lint, test, and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore Cargo dependencies and build outputs
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-1.98-ci-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98-ci-v1-
      - name: Verify the complete Rust workspace
        run: ./scripts/verify-workspace.sh
      - name: Verify Linux deployment isolation on the disposable runner
        run: ./scripts/test-environment-isolation.sh

  release:
    name: Version and publish successful main builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: workspace
    environment:
      name: stable-release
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    permissions:
      contents: write # create the generated version commit, tag, and GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the successfully verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live repository and environment protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PROTECTION_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: ./scripts/check-release-protections.sh
      - name: Install the reviewed Cocogitto release
        env:
          COG_ARCHIVE_SHA256: e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb
          COG_ARCHIVE_URL: https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz
        run: |
          archive="$RUNNER_TEMP/cocogitto-7.0.0.tar.gz"
          tool_directory="$RUNNER_TEMP/cocogitto-bin"
          curl --fail --location --proto '=https' --tlsv1.2 "$COG_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$COG_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir --parents "$tool_directory"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install --mode 0755 "$RUNNER_TEMP/x86_64-unknown-linux-musl/cog" "$tool_directory/cog"
          printf '%s\n' "$tool_directory" >>"$GITHUB_PATH"
      - name: Confirm the Cocogitto version
        run: test "$(cog --version)" = "cog 7.0.0"
      - name: Configure the release commit identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Calculate and create the version commit and tag
        id: version
        run: |
          cog bump --auto --skip-ci
          release_tag="$(git tag --points-at HEAD --list 'v[0-9]*' | head --lines=1)"
          if [[ -z "$release_tag" ]]; then
            printf 'released=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          release_version="${release_tag#v}"
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "uob-service") | .version')"
          test "$release_version" = "$manifest_version"
          cargo check --locked --package uob-service
          printf 'released=true\n' >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"
      - name: Atomically publish the version commit and tag, then create the release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh auth setup-git
          git push --atomic origin HEAD:main "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --latest --title "$RELEASE_TAG"

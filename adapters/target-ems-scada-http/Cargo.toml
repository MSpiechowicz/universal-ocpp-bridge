[package]
name = "uob-ems-scada-http-target-adapter"
description = "Direct EMS/SCADA HTTP integration target adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
time.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
toml.workspace = true
uob-application = { path = "../../crates/application" }
uob-contracts = { path = "../../crates/contracts" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
uob-storage-adapter = { path = "../storage" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
uob-management-adapter = { path = "../management" }
uob-target-adapter = { path = "../target" }
uob-target-conformance = { path = "../../tests/target-conformance" }

[lints]
workspace = true

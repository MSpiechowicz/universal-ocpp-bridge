# Only TLS is exposed; Docker publishes this listener on a random host loopback port.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /fixture/passwords
acl_file /fixture/acl
cafile /fixture/ca.crt
certfile /fixture/server.crt
keyfile /fixture/server.key
persistence false
log_dest stdout
log_type error

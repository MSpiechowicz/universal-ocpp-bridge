[workspace]
members = [
    "crates/contracts",
    "crates/domain",
    "crates/application",
    "tests/target-conformance",
    "tests/ocpp-fixtures",
    "adapters/protocol",
    "adapters/target",
    "adapters/storage",
    "adapters/export",
    "adapters/providers",
    "adapters/management",
    "bins/uob-service",
    "bins/uob-sim",
    "bins/uob-release-manager",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MSpiechowicz/universal-ocpp-bridge"
rust-version = "1.87"

[workspace.dependencies]
axum = "=0.8.4"
ocpp-client = { version = "=0.4.0", default-features = false, features = ["std", "tokio-runtime", "websocket", "ocpp_1_6", "ocpp_2_0_1"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
schemars = "=1.0.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "=1.49.0", default-features = false }
uuid = { version = "=1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

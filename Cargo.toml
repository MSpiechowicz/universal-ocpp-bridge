[workspace]
members = [
    "crates/contracts",
    "crates/domain",
    "crates/application",
    "tests/target-conformance",
    "tests/database-conformance",
    "tests/ocpp-fixtures",
    "tests/hostile-websocket-peer",
    "tests/repository-checks",
    "adapters/protocol",
    "adapters/target",
    "adapters/storage",
    "adapters/export",
    "adapters/providers",
    "adapters/management",
    "bins/uob-service",
    "bins/uob-sim",
    "bins/uob-release-manager",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MSpiechowicz/universal-ocpp-bridge"
rust-version = "1.98"

[workspace.dependencies]
axum = "=0.8.4"
ocpp-client = { version = "=0.4.0", default-features = false, features = ["std", "tokio-runtime", "websocket", "ocpp_1_6", "ocpp_2_0_1"] }
rust-ocpp = { version = "=3.0.4", default-features = false, features = ["v1_6", "v2_0_1"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
schemars = "=1.0.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "=1.49.0", default-features = false }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
toml = "=0.9.8"
uuid = { version = "=1.26.0", features = ["v4"] }
validator = { version = "=0.20.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

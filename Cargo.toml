[workspace]
members = [
    "crates/contracts",
    "crates/domain",
    "crates/application",
    "tests/target-conformance",
    "tests/database-conformance",
    "tests/ocpp-fixtures",
    "tests/hostile-websocket-peer",
    "tests/repository-checks",
    "adapters/protocol",
    "adapters/target",
    "adapters/target-mqtt",
    "adapters/storage",
    "adapters/export",
    "adapters/providers",
    "adapters/management",
    "bins/uob-service",
    "bins/uob-sim",
    "bins/uob-release-manager",
]
resolver = "3"

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MSpiechowicz/universal-ocpp-bridge"
rust-version = "1.98"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.22.1"
futures-util = "=0.3.34"
libc = "=0.2.189"
ocpp-client = { version = "=0.5.0", default-features = false, features = ["std", "tokio-runtime", "websocket", "ocpp_1_6", "ocpp_2_0_1"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream"] }
rumqttc = { package = "rumqttc-v4-next", version = "=0.34.0", default-features = false, features = ["use-rustls"] }
rcgen = "=0.14.5"
rust-ocpp = { version = "=3.0.4", default-features = false, features = ["v1_6", "v2_0_1"] }
rustls = "=0.23.43"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", default-features = false }
tokio-rustls = "=0.26.4"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "=1.1.4"
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }
validator = { version = "=0.20.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
